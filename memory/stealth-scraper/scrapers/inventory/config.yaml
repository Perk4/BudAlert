# Global scheduler settings
global_settings:
  # Maximum number of concurrent scrapers running
  max_concurrent_scrapers: 3
  
  # Default delay between starting scrapers (seconds)
  default_delay_between_stores: 5
  
  # How often to save state (seconds)
  state_save_interval: 300
  
  # How long to keep old extraction data (days)
  cleanup_old_data_days: 30
  
  # Error handling
  max_consecutive_failures: 5  # Disable store after this many failures
  backoff_multiplier: 2  # Multiply interval by this on error
  max_backoff_minutes: 1440  # Maximum backoff (24 hours)
  
  # Resource limits
  max_memory_mb: 1024  # Kill scraper if it uses more memory
  max_runtime_minutes: 10  # Kill scraper if it runs longer
  
# Alert settings
alerts:
  enabled: true
  
  # Alert thresholds
  price_drop_threshold: 5.0  # Alert if price drops by this much ($)
  new_product_alert: true  # Alert when new products appear
  stock_alert: true  # Alert when items come back in stock
  
  # Notification channels
  channels:
    email: false
    discord: false
    slack: false
    webhook: false