version: '3.8'

services:
  conbud-scraper:
    build: .
    container_name: conbud-scraper
    volumes:
      # Mount output directory for scraped data
      - ./output:/app/output
      # Mount source code for development
      - ./scraper-network-intercept.js:/app/scraper-network-intercept.js
      - ./scraper-graphql-direct.js:/app/scraper-graphql-direct.js
    environment:
      # Playwright settings
      - PLAYWRIGHT_BROWSERS_PATH=/app/.cache
      - NODE_ENV=production
      # Optional: Add proxy settings if needed
      # - HTTP_PROXY=http://proxy:8080
      # - HTTPS_PROXY=http://proxy:8080
    # Run in interactive mode for debugging
    stdin_open: true
    tty: true
    # Uncomment for headless mode
    # command: node scraper-network-intercept.js
    
    # Networking
    network_mode: bridge
    
    # Resource limits
    mem_limit: 2g
    cpus: 2.0
